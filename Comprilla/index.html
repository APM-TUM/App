<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lista compartida</title>
<style>
:root{--bg:#f4f4f1;--c:#fff;--t:#161614;--m:#77776f;--a:#0f8a4f;--b:#e6e5de;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--c:#1d1d1b;--t:#f1f0ea;--m:#96968d;--a:#2fbf78;--b:#2c2c29;--sh:none}}
:root[data-theme="dark"]{--bg:#121211;--c:#1d1d1b;--t:#f1f0ea;--m:#96968d;--a:#2fbf78;--b:#2c2c29;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:12px 14px 8px}
.h1{display:flex;align-items:center;gap:6px}
#tit{flex:1;min-width:0;font-size:22px;font-weight:700;background:transparent;border:0;padding:4px 2px;outline:0}
.ib{position:relative;width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--b);background:var(--c);border-radius:12px;padding:0}
.ib select{position:absolute;inset:0;width:100%;opacity:0}
.acts{display:flex;gap:8px;margin-top:8px}
.acts .big{flex-direction:column;gap:4px;font-size:13px;padding:10px 4px}
.big{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 8px;border-radius:14px;border:1px solid var(--b);background:var(--c);font-weight:600;box-shadow:var(--sh)}
.big.pr,.btn.pr{background:var(--a);border-color:var(--a);color:#fff}
#list{flex:1;overflow-y:auto;padding:4px 14px 12px;display:flex;flex-direction:column;gap:8px}
.r{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:10px 8px 10px 12px;box-shadow:var(--sh)}
.l1{display:flex;align-items:center;gap:6px}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--b);background:transparent;padding:0;display:grid;place-items:center;color:#fff;flex:none;margin-right:2px}
.ck .i{width:15px;height:15px;stroke-width:3;opacity:0}
.ck.on{background:var(--a);border-color:var(--a)}.ck.on .i{opacity:1}
.n{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:6px 2px;outline:0}
.r.d .n{text-decoration:line-through;color:var(--m)}
.tb{border:0;background:transparent;color:var(--m);padding:7px;border-radius:10px;display:grid;place-items:center}
.l2{display:flex;gap:10px;align-items:center;margin:4px 6px 0 36px;flex-wrap:wrap}
.f{display:flex;align-items:center;gap:6px;color:var(--m);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.f input{width:66px;text-align:center;font-size:16px;padding:7px 4px;border:1px solid var(--b);border-radius:10px;background:var(--bg);text-transform:none}
.st{margin-left:auto;font-weight:800;font-size:16px;color:var(--a)}
.sp{display:flex;align-items:center;border:1px solid var(--b);border-radius:12px;background:var(--bg);text-transform:none}
.sp button{width:42px;height:40px;border:0;background:transparent;display:grid;place-items:center;color:var(--t);border-radius:11px}
.sp button:active{background:var(--b)}
.f .sp input{width:46px;height:40px;border:0;border-radius:0;background:transparent;font-weight:700;padding:0}
.f input::-webkit-outer-spin-button,.f input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.f input[type=number]{-moz-appearance:textfield}
.tot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--c);border-top:1px solid var(--b)}
.tot small{display:block;color:var(--m);font-size:12px;font-weight:600;letter-spacing:.02em}
.tot b{font-size:15px;text-transform:uppercase;letter-spacing:.06em}
#tv{font-size:26px;font-weight:800;color:var(--a);letter-spacing:-.02em;flex:1;text-align:right}#tv.z{color:var(--m)}
.li{display:flex;align-items:center;border:1px solid var(--b);border-radius:14px;margin-bottom:8px;background:var(--bg)}
.li.cur{border-color:var(--a)}
.lo{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:12px;display:flex;flex-direction:column;gap:2px}
.lo b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lo small{color:var(--m)}
.li .tb{padding:14px;color:#d64545}.li .tb[data-c]{color:var(--t)}
.mb{width:52px;height:52px;border-radius:16px;border:1px solid var(--b);background:var(--c);display:grid;place-items:center;flex:none}
.mb.on{background:#d64545;color:#fff;border-color:#d64545;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.55}}
#fin{display:flex;align-items:center;gap:6px;border:0;background:var(--a);color:#fff;font-weight:700;border-radius:12px;padding:11px 12px;flex:none}
#tkI img{width:100%;display:block;border-radius:12px;border:1px solid var(--b)}
#ts{gap:14px;align-items:center}#tu{border:0;background:transparent;color:#7fe0ae;font-weight:700;padding:0 4px}
.e{margin:auto;text-align:center;color:var(--m);padding:20px;display:flex;flex-direction:column;gap:6px;align-items:center}
.e .i{width:46px;height:46px;stroke-width:1.3}
.cp{padding:8px 14px 12px;background:var(--bg);border-top:1px solid var(--b)}
.seg{display:inline-flex;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:3px;margin-bottom:8px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;color:var(--m);font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.seg button.on{background:var(--a);color:#fff}
.in{display:flex;gap:8px}
#txt{flex:1;min-width:0;height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--b);background:var(--c);font-size:16px}
#add{width:52px;height:52px;border-radius:16px;border:0;background:var(--a);color:#fff;display:grid;place-items:center;box-shadow:var(--sh)}
#add .i{width:26px;height:26px;stroke-width:2.4}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sh>div{width:min(100%,560px);background:var(--c);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}
.sht{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sht h2{margin:0;font-size:18px}
.btn{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;padding:14px;border-radius:14px;border:1px solid var(--b);background:var(--bg);font-weight:600;margin-top:8px}
#qs{background:#fff;border-radius:14px;padding:6px;min-height:120px}
#qs img{width:100%;max-width:340px;display:block;margin:auto;image-rendering:pixelated}
.hint{color:var(--m);font-size:13px;text-align:center;margin:8px 0 0;min-height:18px}
.vw{position:relative;border-radius:16px;overflow:hidden;background:#000;height:230px;display:grid;place-items:center;color:#aaa}
#vd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vw:after{content:"";position:absolute;inset:16% 22%;border:2px solid rgba(255,255,255,.85);border-radius:16px;pointer-events:none}
#off{display:none}
.vw.off{height:64px}.vw.off #vd,.vw.off:after{display:none}.vw.off #off{display:block}
#ts{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:20;max-width:90vw;text-align:center;font-weight:600}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></symbol>

<symbol id="i-addq" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M12 9v6M9 12h6"/></symbol>

</svg>
<div class="app">
<header>
<div class="h1"><input id="tit" placeholder="Nombre de la lista" aria-label="Nombre de la lista">
<button class="ib" id="lm" title="Mis listas" aria-label="Mis listas"><svg class="i"><use href="#i-list"/></svg></button>
<button class="ib" id="new" title="Nueva lista" aria-label="Nueva lista"><svg class="i"><use href="#i-plus"/></svg></button></div>
<div class="acts"><button class="big" id="ld"><svg class="i"><use href="#i-scan"/></svg>Cargar QR</button><button class="big" id="sumq"><svg class="i"><use href="#i-addq"/></svg>Añadir pedido</button><button class="big pr" id="qb"><svg class="i"><use href="#i-qr"/></svg>Compartir QR</button></div>
</header>
<div id="list"></div>
<div class="tot"><div><small id="tn"></small><b>Total</b></div><div id="tv"></div><button id="fin"><svg class="i"><use href="#i-rec"/></svg>Finalizar</button></div>
<div class="cp">
<div class="seg"><button id="kp" class="on"><svg class="i"><use href="#i-bag"/></svg>Producto</button><button id="kt"><svg class="i"><use href="#i-task"/></svg>Tarea</button></div>
<div class="in"><input id="txt" placeholder="Agregar… (varios con comas)" enterkeyhint="done" autocomplete="off"><button id="mic" class="mb" aria-label="Dictar por voz"><svg class="i"><use href="#i-mic"/></svg></button><button id="add" aria-label="Agregar a la lista"><svg class="i"><use href="#i-plus"/></svg></button></div>
</div>
</div>
<div id="qr" class="sh"><div>
<div class="sht"><h2>Compartir lista</h2><button class="ib" id="qc" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
<div id="qs"></div><p class="hint" id="qe">La otra persona escanea este QR con “Cargar QR”.</p>
<button class="btn pr" id="qw"><svg class="i"><use href="#i-chat"/></svg>Enviar QR por WhatsApp</button>
<button class="btn" id="qd"><svg class="i"><use href="#i-down"/></svg>Descargar imagen QR</button>
</div></div>
<div id="sc" class="sh"><div>
<div class="sht"><h2 id="sh2">Cargar QR</h2><button class="ib" id="sx" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
<div class="vw" id="vw"><video id="vd" playsinline muted></video><div id="off"><svg class="i" style="width:28px;height:28px"><use href="#i-camoff"/></svg></div></div>
<canvas id="cv" hidden></canvas><input type="file" id="fi" accept="image/*" style="position:absolute;left:-9999px">
<p class="hint" id="sm"></p>
<button class="btn" id="ct"></button>
<label class="btn" for="fi"><svg class="i"><use href="#i-img"/></svg>Elegir imagen de la galería</label>
</div></div>
<div id="tks" class="sh"><div>
<div class="sht"><h2>Pedido final</h2><button class="ib" id="tkc" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
<div id="tkI"></div>
<button class="btn pr" id="tkw"><svg class="i"><use href="#i-chat"/></svg>Enviar ticket por WhatsApp</button>
<button class="btn" id="tkd"><svg class="i"><use href="#i-down"/></svg>Descargar ticket</button>
</div></div>
<div id="ls" class="sh"><div>
<div class="sht"><h2>Mis listas</h2><button class="ib" id="lc" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
<div id="lb"></div>
<button class="btn pr" id="ln"><svg class="i"><use href="#i-plus"/></svg>Nueva lista</button>
</div></div>
<div id="ts"><span id="tm"></span><button id="tu">Deshacer</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
var L,db,kind='p',scanMode='load',qBlob=null,stream=null,raf=0,cam=false,bd=null;
try{if('BarcodeDetector' in window)bd=new BarcodeDetector({formats:['qr_code']})}catch(e){}
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,7)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var fmt=function(n){return String(+n.toFixed(2))};
function ic(n){return '<svg class="i"><use href="#i-'+n+'"/></svg>'}
function show(id,v){$(id).style.display=v?'flex':'none'}
$('#tm').onclick=function(){$('#ts').style.display='none'};
function toast(m,undo){var t=$('#ts');$('#tm').textContent=m;$('#tu').style.display=undo?'block':'none';$('#tu').onclick=function(){t.style.display='none';if(undo)undo()};t.style.display='flex';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},undo?3500:1800)}
function openDB(){return new Promise(function(r){try{var q=indexedDB.open('listas',2);q.onupgradeneeded=function(){var d=q.result;if(!d.objectStoreNames.contains('l'))d.createObjectStore('l',{keyPath:'id'});if(!d.objectStoreNames.contains('p'))d.createObjectStore('p',{keyPath:'k'})};q.onsuccess=function(){db=q.result;r()};q.onerror=function(){r()}}catch(e){r()}})}
function put(l){try{db&&db.transaction('l','readwrite').objectStore('l').put(l)}catch(e){}}
function all(){return new Promise(function(r){try{var q=db.transaction('l').objectStore('l').getAll();q.onsuccess=function(){r(q.result||[])};q.onerror=function(){r([])}}catch(e){r([])}})}
function clean(s){return String(s).replace(/[|~]/g,' ')}
function enc(l){var s=[l.id,l.v,clean(l.t)].join('|')+'~'+l.i.map(function(x){return[clean(x.n),x.q,x.p,x.d?1:0,x.k].join('|')}).join('~');return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');var t=decodeURIComponent(escape(atob(s))).split('~'),h=t.shift().split('|');return{id:h[0],v:+h[1]||0,t:h.slice(2).join('|'),i:t.filter(Boolean).map(function(z){var a=z.split('|');return{n:a[0],q:+a[1]||0,p:+a[2]||0,d:a[3]=='1',k:a[4]=='t'?'t':'p'}})}}catch(e){return null}}
var PR={},PH='Agregar… (varios con comas)';
function norm(s){s=String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();return s.replace(/(\w{3,})s$/,'$1')}
function loadPR(){return new Promise(function(r){try{var q=db.transaction('p').objectStore('p').getAll();q.onsuccess=function(){(q.result||[]).forEach(function(x){PR[x.k]=x.p});r()};q.onerror=function(){r()}}catch(e){r()}})}
function savePrice(n,p){var k=norm(n);if(!(p>0)||!k)return;PR[k]=p;try{db.transaction('p','readwrite').objectStore('p').put({k:k,p:p})}catch(e){}}
function learn(l){l.i.forEach(function(x){if(x.k=='p')savePrice(x.n,x.p)})}
var NUM={un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,quince:15,veinte:20,medio:.5,media:.5};
function parseItem(s){
  var w=s.trim().split(/\s+/),q=1,f=(w[0]||'').toLowerCase();
  if(!w[0])return null;
  if(/^\d+([.,]\d+)?$/.test(f)&&w.length>1){q=+f.replace(',','.');w.shift()}
  else if(NUM[f]!=null&&w.length>1){q=NUM[f];w.shift()}
  var n=w.join(' ').replace(/^(de|del)\s+/i,'');
  return n?{n:n.charAt(0).toUpperCase()+n.slice(1),q:q}:null;
}
function addItems(a){
  a.forEach(function(o){
    if(kind=='p'){var f=L.i.filter(function(y){return y.k=='p'&&norm(y.n)==norm(o.n)})[0];
      if(f){f.q=+(f.q+o.q).toFixed(2);return}}
    L.i.push({n:o.n,q:o.q,p:kind=='p'?(PR[norm(o.n)]||0):0,d:false,k:kind});
  });
  change();render();fillSel();var l=$('#list');l.scrollTop=l.scrollHeight;
}
function fresh(){return{id:uid(),v:0,t:'Mi lista',i:[]}}
function sync(){try{history.replaceState(null,'','#L='+enc(L))}catch(e){}}
function change(){L.v++;L.u=Date.now();put(L);sync()}
function total(){return L.i.reduce(function(a,x){return a+(x.k=='p'?x.q*x.p:0)},0)}
function sub(x){return x.p>0?'Bs '+fmt(x.q*x.p):''}
function info(){var s=total(),n=L.i.length,d=L.i.filter(function(x){return x.d}).length;
  $('#tn').textContent=n?n+(n==1?' ítem':' ítems')+' · '+d+(d==1?' listo':' listos'):'Sin ítems';
  $('#tv').textContent='Bs '+fmt(s);$('#tv').classList.toggle('z',s==0)}
function row(x,i){
  var p=x.k=='p';
  return '<div class="r'+(x.d?' d':'')+'"><div class="l1"><button class="ck'+(x.d?' on':'')+'" data-a="d" data-i="'+i+'" aria-label="Marcar como listo">'+ic('check')+'</button><input class="n" data-a="n" data-i="'+i+'" value="'+esc(x.n)+'" enterkeyhint="done"><button class="tb" data-a="k" data-i="'+i+'" title="'+(p?'Cambiar a tarea':'Cambiar a producto')+'">'+ic(p?'bag':'task')+'</button><button class="tb" data-a="x" data-i="'+i+'" title="Eliminar">'+ic('trash')+'</button></div>'
  +(p?'<div class="l2"><div class="f">Cant.<div class="sp"><button data-a="dec" data-i="'+i+'" aria-label="Menos">'+ic('minus')+'</button><input type="number" inputmode="decimal" min="0" data-a="q" data-i="'+i+'" value="'+x.q+'"><button data-a="inc" data-i="'+i+'" aria-label="Más">'+ic('plus')+'</button></div></div><label class="f">Precio Bs<input type="number" inputmode="decimal" min="0" step="any" data-a="p" data-i="'+i+'" value="'+x.p+'"></label><span class="st" id="st'+i+'">'+sub(x)+'</span></div>':'')+'</div>';
}
function render(){
  $('#tit').value=L.t;
  $('#list').innerHTML=L.i.length?L.i.map(row).join(''):'<div class="e">'+ic('bag')+'<b>Tu lista está vacía</b><span>Escribe abajo y toca +. Puedes separar varios con comas.</span></div>';
  info();
}
function fillSel(){if($('#ls').style.display=='flex')renderLists()}
async function boot(){
  var saved=await all(),h=location.hash,inc=h.indexOf('#L=')==0?dec(h.slice(3)):null;
  if(inc){var ex=saved.filter(function(x){return x.id==inc.id})[0];
    if(!ex||inc.v>=ex.v){L=inc;L.u=Date.now();put(L)}else L=ex}
  else if(saved.length){saved.sort(function(a,b){return(b.u||0)-(a.u||0)});L=saved[0]}
  else{L=fresh();L.u=Date.now();put(L)}
  learn(L);sync();render();fillSel();
}
function add(voice){
  var v=$('#txt').value.split(voice?/,|\n|\s+y\s+|\s+más\s+/:/,|\n/).map(function(x){return x.trim()}).filter(Boolean);
  if(!v.length)return;
  addItems(v.map(function(n){return kind=='p'?parseItem(n):{n:n,q:1}}).filter(Boolean));
  $('#txt').value='';$('#txt').focus();
}
$('#add').onclick=function(){add()};
$('#txt').onkeydown=function(e){if(e.key=='Enter'){e.preventDefault();add()}};
function setKind(k){kind=k;$('#kp').classList.toggle('on',k=='p');$('#kt').classList.toggle('on',k=='t');$('#txt').focus()}
$('#kp').onclick=function(){setKind('p')};$('#kt').onclick=function(){setKind('t')};
$('#tit').oninput=function(){L.t=this.value;change()};
$('#tit').onchange=fillSel;
$('#list').addEventListener('input',function(e){
  var t=e.target,a=t.dataset.a,i=t.dataset.i,x=L.i[i];if(!x)return;
  if(a=='n')x.n=t.value;else if(a=='q')x.q=Number(t.value)||0;else if(a=='p'){x.p=Number(t.value)||0;savePrice(x.n,x.p)}else return;
  change();var s=document.getElementById('st'+i);if(s)s.textContent=sub(x);info();
});
$('#list').addEventListener('focusin',function(e){if(e.target.type=='number')e.target.select()});
$('#list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;var i=b.dataset.i,a=b.dataset.a,x=L.i[i];
  if(a=='inc')x.q=+(x.q+1).toFixed(2);else if(a=='dec')x.q=Math.max(0,+(x.q-1).toFixed(2));else if(a=='d')x.d=!x.d;else if(a=='k')x.k=x.k=='p'?'t':'p';else if(a=='x')L.i.splice(i,1);else return;
  change();render();
});
$('#new').onclick=function(){L=fresh();L.u=Date.now();put(L);sync();render();fillSel();$('#tit').focus();$('#tit').select()};
function dupList(id){all().then(function(a){var f=a.filter(function(z){return z.id==id})[0];if(!f)return;
  var n={id:uid(),v:0,t:f.t+' (copia)',i:f.i.map(function(x){return{n:x.n,q:x.q,p:x.p,d:false,k:x.k}}),u:Date.now()};
  put(n);renderLists();toast('Lista duplicada')})}
function del(id){try{db.transaction('l','readwrite').objectStore('l').delete(id)}catch(e){}}
function totalOf(l){return l.i.reduce(function(a,x){return a+(x.k=='p'?x.q*x.p:0)},0)}
function renderLists(){all().then(function(a){
  a.sort(function(x,y){return(y.u||0)-(x.u||0)});
  $('#lb').innerHTML=a.length?a.map(function(x){var s=totalOf(x);
    return '<div class="li'+(x.id==L.id?' cur':'')+'"><button class="lo" data-o="'+x.id+'"><b>'+esc(x.t||'Sin nombre')+'</b><small>'+x.i.length+' ítems'+(s>0?' · Bs '+fmt(s):'')+(x.id==L.id?' · abierta':'')+'</small></button><button class="tb" data-c="'+x.id+'" title="Duplicar lista" aria-label="Duplicar lista">'+ic('copy')+'</button><button class="tb" data-x="'+x.id+'" title="Eliminar lista" aria-label="Eliminar lista">'+ic('trash')+'</button></div>'}).join(''):'<p class="hint">No hay listas.</p>';
})}
$('#lm').onclick=function(){show('#ls',1);renderLists()};
$('#lc').onclick=function(){show('#ls',0)};
$('#ls').onclick=function(e){if(e.target==this)show('#ls',0)};
$('#ln').onclick=function(){show('#ls',0);$('#new').click()};
$('#lb').onclick=function(e){
  var o=e.target.closest('[data-o]'),x=e.target.closest('[data-x]'),cp=e.target.closest('[data-c]');
  if(cp){dupList(cp.dataset.c);return}
  if(o){all().then(function(a){var f=a.filter(function(z){return z.id==o.dataset.o})[0];if(f){L=f;L.u=Date.now();put(L);sync();render();show('#ls',0)}})}
  else if(x){var id=x.dataset.x;all().then(function(a){
    var gone=a.filter(function(z){return z.id==id})[0];if(!gone)return;
    del(id);var rest=a.filter(function(z){return z.id!=id});
    if(id==L.id){if(rest.length){rest.sort(function(p,q){return(q.u||0)-(p.u||0)});L=rest[0]}else{L=fresh();L.u=Date.now();put(L)}sync();render()}
    renderLists();
    toast('Lista eliminada',function(){put(gone);renderLists()});
  })}
};
/* ---- QR: compartir ---- */
function base(){return location.href.split('#')[0]}
function qrPng(cb){
  var q=qrcode(0,'L');q.addData(location.href);q.make();
  var n=q.getModuleCount(),c=Math.max(8,Math.floor(800/(n+8))),sz=c*(n+8),cv=document.createElement('canvas');
  cv.width=cv.height=sz;var g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sz,sz);g.fillStyle='#000';
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))g.fillRect((k+4)*c,(r+4)*c,c,c);
  cv.toBlob(cb,'image/png');
}
$('#qb').onclick=function(){
  qBlob=null;$('#qs').innerHTML='';$('#qe').textContent='La otra persona escanea este QR con “Cargar QR”.';show('#qr',1);
  try{qrPng(function(b){qBlob=b;$('#qs').innerHTML='<img alt="Código QR de la lista" src="'+URL.createObjectURL(b)+'">'})}
  catch(e){$('#qe').textContent='La lista es muy grande para un QR. Quita algunos ítems.'}
};
$('#qc').onclick=function(){show('#qr',0)};
$('#qr').onclick=function(e){if(e.target==this)show('#qr',0)};
$('#qd').onclick=function(){
  if(!qBlob)return;var a=document.createElement('a');a.href=URL.createObjectURL(qBlob);
  a.download=(L.t||'lista').replace(/[^\w-]+/g,'_')+'-QR.png';document.body.appendChild(a);a.click();a.remove();
};

  if(!qBlob)return;
  var txt='*'+L.t+'*\nEscanea el QR, o abre la web y toca "Cargar QR":\n'+base();

  if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],text:txt}).catch(function(){});
  else window.open('https://wa.me/?text='+encodeURIComponent(txt+'\n\nLista directa:\n'+location.href),'_blank');
};
/* ---- QR: cargar ---- */
function stopCam(){cam=false;cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('#vd').srcObject=null}
function noCam(m){stopCam();$('#vw').classList.add('off');$('#ct').innerHTML=ic('cam')+'Encender cámara';$('#sm').textContent=m||'Cámara apagada. Puedes cargar el QR desde una imagen.'}
function startCam(){
  cam=true;$('#vw').classList.remove('off');$('#ct').innerHTML=ic('camoff')+'Apagar cámara';$('#sm').textContent=scanMode=='add'?'Apunta al QR para sumarlo a esta lista':'Apunta al código QR';
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){noCam('Este navegador no permite usar la cámara.');return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(function(s){
    if(!cam){s.getTracks().forEach(function(t){t.stop()});return}
    stream=s;var v=$('#vd');v.srcObject=s;v.play().catch(function(){});tick();
  }).catch(function(){noCam('No se pudo abrir la cámara. Usa una imagen de la galería.')});
}
function closeScan(){stopCam();show('#sc',0)}
function jsq(c){try{var d=c.getContext('2d').getImageData(0,0,c.width,c.height),r=jsQR(d.data,d.width,d.height);return r?r.data:null}catch(e){return null}}
function readCanvas(c,src){
  var p=bd?bd.detect(src).then(function(a){return a.length?a[0].rawValue:null}).catch(function(){return null}):Promise.resolve(null);
  return p.then(function(t){return t||jsq(c)});
}
function mergeIn(l){
  var key=l.id+':'+l.v;
  if(l.id==L.id){toast('Ese QR es de esta misma lista. Usa "Cargar QR" para reemplazarla.');return}
  L.m=L.m||[];
  if(L.m.indexOf(key)>=0){toast('Ese QR ya fue añadido');return}
  var bak=JSON.stringify(L.i),nw=0,mg=0;
  l.i.forEach(function(x){
    var f=L.i.filter(function(y){return y.k==x.k&&norm(y.n)==norm(x.n)})[0];
    if(f){mg++;if(x.k=='p'){f.q=+(f.q+x.q).toFixed(2);if(!f.p&&x.p)f.p=x.p}}
    else{nw++;L.i.push({n:x.n,q:x.q,p:x.p,d:x.d,k:x.k})}
  });
  learn(l);L.m.push(key);change();render();var e=$('#list');e.scrollTop=e.scrollHeight;
  toast('Añadido: '+nw+(nw==1?' nuevo':' nuevos')+(mg?' · '+mg+' sumados a existentes':''),function(){L.i=JSON.parse(bak);L.m.pop();change();render()});
}
function got(txt){
  var i=txt?txt.indexOf('#L='):-1,l=i>=0?dec(txt.slice(i+3)):null;
  if(!l){$('#sm').textContent='Ese QR no es de una lista.';return false}
  closeScan();
  if(scanMode=='add'){mergeIn(l);return true}
  all().then(function(a){var ex=a.filter(function(x){return x.id==l.id})[0];
    L=l;learn(l);L.v=Math.max(l.v,ex?ex.v:0);L.u=Date.now();put(L);sync();render();fillSel();$('#list').scrollTop=0;
    toast('Lista cargada: '+L.t+' ('+L.i.length+' ítems)')});
  return true;
}
function tick(){
  if(!stream)return;var v=$('#vd');
  if(v.readyState>=2&&v.videoWidth){
    var c=$('#cv'),w=Math.min(v.videoWidth,1280),k=w/v.videoWidth;c.width=w;c.height=Math.round(v.videoHeight*k);
    c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    readCanvas(c,v).then(function(t){if(!stream)return;if(t&&got(t))return;raf=requestAnimationFrame(tick)});
    return;
  }
  raf=requestAnimationFrame(tick);
}
$('#ld').onclick=function(){scanMode='load';$('#sh2').textContent='Cargar QR';show('#sc',1);startCam()};
$('#sumq').onclick=function(){scanMode='add';$('#sh2').textContent='Añadir pedido';show('#sc',1);startCam()};
$('#sx').onclick=closeScan;
$('#sc').onclick=function(e){if(e.target==this)closeScan()};
$('#ct').onclick=function(){if(cam)noCam();else startCam()};
document.addEventListener('visibilitychange',function(){if(document.hidden&&stream)noCam()});
$('#fi').onchange=function(){
  var f=this.files&&this.files[0];if(!f)return;var inp=this;$('#sm').textContent='Leyendo imagen…';
  var im=new Image();
  im.onload=function(){
    var c=$('#cv'),k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight));
    c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    readCanvas(c,c).then(function(t){if(t)got(t);else $('#sm').textContent='No encontré un QR en esa imagen.'});
  };
  im.onerror=function(){$('#sm').textContent='No pude abrir esa imagen.'};
  im.src=URL.createObjectURL(f);inp.value='';
};
/* ---- Finalizar: ticket ---- */
function rr(g,t,w){var o=t;while(t.length>1&&g.measureText(t).width>w)t=t.slice(0,-1);return t==o?t:t+'…'}
function ticketPng(cb){
  var W=720,P=40,rows=L.i,rh=46,hh=170,q=null,n=0;
  try{q=qrcode(0,'L');q.addData(location.href);q.make();n=q.getModuleCount()}catch(e){q=null}
  var qc=q?Math.max(4,Math.floor(320/(n+8))):0,qsz=q?qc*(n+8):0;
  var H=hh+rows.length*rh+(q?qsz+250:200);
  var cv=document.createElement('canvas');cv.width=W;cv.height=H;var g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  g.fillStyle='#161614';g.font='700 38px system-ui,sans-serif';g.fillText(rr(g,L.t||'Pedido',W-2*P),P,74);
  g.fillStyle='#77776f';g.font='500 24px system-ui,sans-serif';
  var d=new Date();g.fillText(d.toLocaleDateString('es-BO')+'  '+d.toLocaleTimeString('es-BO',{hour:'2-digit',minute:'2-digit'}),P,112);
  g.fillStyle='#e6e5de';g.fillRect(P,138,W-2*P,2);
  var y=hh;
  rows.forEach(function(x){
    y+=rh;g.font='600 27px system-ui,sans-serif';g.fillStyle='#161614';
    var st=x.k=='p'&&x.p>0?'Bs '+fmt(x.q*x.p):'',sw=st?g.measureText(st).width+16:0;
    g.fillText(rr(g,(x.k=='p'?fmt(x.q)+' × ':'• ')+x.n,W-2*P-sw),P,y-12);
    if(st){g.textAlign='right';g.fillText(st,W-P,y-12);g.textAlign='left'}
  });
  y+=30;g.fillStyle='#e6e5de';g.fillRect(P,y,W-2*P,2);
  y+=70;g.fillStyle='#161614';g.font='700 30px system-ui,sans-serif';g.fillText('TOTAL',P,y);
  g.fillStyle='#0f8a4f';g.font='800 46px system-ui,sans-serif';g.textAlign='right';g.fillText('Bs '+fmt(total()),W-P,y+4);g.textAlign='left';
  if(q){var ox=(W-qsz)/2,oy=y+40;g.fillStyle='#000';
    for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))g.fillRect(ox+(k+4)*qc,oy+(r+4)*qc,qc,qc);
    g.fillStyle='#77776f';g.font='500 22px system-ui,sans-serif';g.textAlign='center';g.fillText('Escanea para abrir este pedido',W/2,oy+qsz+34);g.textAlign='left'}
  cv.toBlob(cb,'image/png');
}

/* ---- Dictado por voz ---- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,lis=false;
if(!SR)$('#mic').style.display='none';
$('#mic').onclick=function(){
  if(lis){if(rec)rec.stop();return}
  var fin='';rec=new SR();rec.lang='es-BO';rec.interimResults=true;
  rec.onstart=function(){lis=true;$('#mic').classList.add('on');$('#txt').placeholder='Escuchando…'};
  rec.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';fin=t.trim();$('#txt').value=fin};
  rec.onerror=function(e){if(e.error=='not-allowed'||e.error=='service-not-allowed')toast('Permite el micrófono para dictar')};
  rec.onend=function(){lis=false;$('#mic').classList.remove('on');$('#txt').placeholder=PH;if(fin){$('#txt').value=fin;add(true)}};
  try{rec.start()}catch(e){}
};
